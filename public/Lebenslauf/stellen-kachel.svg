<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" role="img" aria-label="Bewerbungsvorlage: Anschreiben und Lebenslauf">
  <!-- DIE KACHEL ZEIGT DIE BEWERBUNGSVORLAGE (Owner 25.08.2026: „und als Icon machen wir
       eine Bewerbungsvorlage").
       Kein abstraktes Zeichen, sondern das ERGEBNIS: zwei Blätter, wie sie das PDF liefert —
       hinten das Anschreiben, vorn der zweispaltige Lebenslauf mit Fakten-Spalte, Foto und
       blauem Akzent. Dasselbe Prinzip wie „Landingpage-Video = Kachel-Video": Die Kachel
       zeigt das Produkt, nicht ein Sinnbild davon. Masse und Farben folgen dem echten
       Layout aus lib/bewerbung-pdf.ts (Papier weiss, Akzent #1877F2, Fakten-Spalte getönt).
       Personendaten gibt es hier bewusst KEINE — nur Balken; die Kachel steht öffentlich. -->
  <rect width="360" height="640" fill="#16120f"/>
  <rect x="1" y="1" width="358" height="638" fill="none" stroke="#f6cf51" stroke-opacity="0.28" stroke-width="2" rx="18"/>

  <!-- Hinteres Blatt: das Anschreiben -->
  <g transform="translate(96 72) rotate(-5)">
    <rect x="0" y="0" width="196" height="272" rx="7" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="20" y="26" width="86" height="9" rx="4" fill="#1877F2" fill-opacity="0.5"/>
    <rect x="20" y="44" width="120" height="5" rx="2.5" fill="#8a929c" fill-opacity="0.6"/>
    <rect x="20" y="62" width="156" height="1.5" fill="#1877F2" fill-opacity="0.45"/>
    <g fill="#8a929c" fill-opacity="0.55">
      <rect x="20" y="88" width="72" height="5" rx="2.5"/>
      <rect x="20" y="110" width="156" height="4" rx="2"/>
      <rect x="20" y="124" width="150" height="4" rx="2"/>
      <rect x="20" y="138" width="156" height="4" rx="2"/>
      <rect x="20" y="152" width="104" height="4" rx="2"/>
      <rect x="20" y="176" width="156" height="4" rx="2"/>
      <rect x="20" y="190" width="144" height="4" rx="2"/>
      <rect x="20" y="204" width="156" height="4" rx="2"/>
      <rect x="20" y="218" width="88" height="4" rx="2"/>
    </g>
  </g>

  <!-- Vorderes Blatt: der zweispaltige Lebenslauf -->
  <g transform="translate(64 104)">
    <rect x="0" y="0" width="212" height="294" rx="8" fill="#ffffff"/>
    <rect x="0" y="0" width="74" height="294" rx="8" fill="#eef1f5"/>
    <rect x="66" y="0" width="8" height="294" fill="#eef1f5"/>
    <rect x="74" y="0" width="2" height="294" fill="#1877F2" fill-opacity="0.85"/>

    <rect x="16" y="18" width="42" height="52" rx="5" fill="#c7ced8"/>
    <circle cx="37" cy="38" r="10" fill="#eef1f5"/>
    <path d="M21 64c3-11 9-16 16-16s13 5 16 16z" fill="#eef1f5"/>

    <g>
      <rect x="16" y="86" width="34" height="6" rx="3" fill="#1877F2" fill-opacity="0.8"/>
      <rect x="16" y="98" width="42" height="1.5" fill="#c7ced8"/>
      <g fill="#aab2bd">
        <rect x="16" y="108" width="40" height="4" rx="2"/>
        <rect x="16" y="120" width="34" height="4" rx="2"/>
        <rect x="16" y="132" width="42" height="4" rx="2"/>
      </g>
      <rect x="16" y="152" width="40" height="6" rx="3" fill="#1877F2" fill-opacity="0.8"/>
      <rect x="16" y="164" width="42" height="1.5" fill="#c7ced8"/>
      <g fill="#aab2bd">
        <rect x="16" y="174" width="38" height="4" rx="2"/>
        <rect x="16" y="186" width="42" height="4" rx="2"/>
        <rect x="16" y="198" width="30" height="4" rx="2"/>
      </g>
      <rect x="16" y="218" width="30" height="6" rx="3" fill="#1877F2" fill-opacity="0.8"/>
      <rect x="16" y="230" width="42" height="1.5" fill="#c7ced8"/>
      <g fill="#aab2bd">
        <rect x="16" y="240" width="36" height="4" rx="2"/>
        <rect x="16" y="252" width="28" height="4" rx="2"/>
      </g>
    </g>

    <rect x="90" y="24" width="98" height="12" rx="4" fill="#3d444d"/>
    <rect x="90" y="44" width="76" height="5" rx="2.5" fill="#1877F2" fill-opacity="0.7"/>

    <rect x="90" y="68" width="3" height="11" rx="1.5" fill="#1877F2"/>
    <rect x="99" y="70" width="30" height="7" rx="3.5" fill="#3d444d" fill-opacity="0.85"/>
    <g fill="#aab2bd">
      <rect x="90" y="88" width="106" height="4" rx="2"/>
      <rect x="90" y="100" width="100" height="4" rx="2"/>
      <rect x="90" y="112" width="106" height="4" rx="2"/>
    </g>

    <rect x="90" y="136" width="3" height="11" rx="1.5" fill="#1877F2"/>
    <rect x="99" y="138" width="46" height="7" rx="3.5" fill="#3d444d" fill-opacity="0.85"/>
    <g>
      <rect x="90" y="158" width="18" height="4" rx="2" fill="#c7ced8"/>
      <rect x="116" y="156" width="60" height="6" rx="3" fill="#3d444d" fill-opacity="0.75"/>
      <rect x="116" y="168" width="48" height="4" rx="2" fill="#1877F2" fill-opacity="0.55"/>
      <rect x="116" y="180" width="80" height="4" rx="2" fill="#aab2bd"/>

      <rect x="90" y="200" width="18" height="4" rx="2" fill="#c7ced8"/>
      <rect x="116" y="198" width="54" height="6" rx="3" fill="#3d444d" fill-opacity="0.75"/>
      <rect x="116" y="210" width="44" height="4" rx="2" fill="#1877F2" fill-opacity="0.55"/>
      <rect x="116" y="222" width="80" height="4" rx="2" fill="#aab2bd"/>

      <rect x="90" y="242" width="18" height="4" rx="2" fill="#c7ced8"/>
      <rect x="116" y="240" width="50" height="6" rx="3" fill="#3d444d" fill-opacity="0.75"/>
      <rect x="116" y="252" width="40" height="4" rx="2" fill="#1877F2" fill-opacity="0.55"/>
      <rect x="116" y="264" width="72" height="4" rx="2" fill="#aab2bd"/>
    </g>
  </g>

  <text x="180" y="462" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="25" font-weight="bold" fill="#ffffff">Bewerbungsvorlage</text>
  <text x="180" y="494" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="17" font-weight="bold" fill="#f6cf51" fill-opacity="0.8">Anschreiben + Lebenslauf</text>
</svg>
